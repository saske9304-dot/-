<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#11151b">
<title>Мой ритм</title>
<style>
:root{--bg:#11151b;--panel:#1d242d;--panel2:#252e39;--text:#f1f3f5;--muted:#9aa6b2;--accent:#8fb7a1;--line:#303a46}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}
header{padding:24px 18px 12px;position:sticky;top:0;background:linear-gradient(#11151b 85%,transparent);z-index:3}
.brand{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:2px}.headrow{display:flex;justify-content:space-between;align-items:center}.headrow h1{font-size:27px;margin:5px 0 0}.date{color:var(--muted);font-size:13px}
main{padding:8px 16px 94px;max-width:680px;margin:auto}.card{background:var(--panel);border:1px solid #29323d;border-radius:18px;padding:16px;margin:12px 0}
.hero{background:linear-gradient(135deg,#26352f,#1d242d 65%)}.muted{color:var(--muted)}.small{font-size:12px}.progress{height:7px;background:#414b59;border-radius:8px;overflow:hidden;margin-top:10px}.bar{height:100%;width:0;background:var(--accent);transition:width .2s}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:14px 0}.day{border:0;border-radius:11px;background:var(--panel);color:var(--muted);padding:10px 2px;font-weight:700}.day.active{background:var(--accent);color:#101712}
.task{display:flex;gap:12px;align-items:center}.time{color:var(--accent);font-size:12px;font-weight:800;width:88px;flex-shrink:0}.taskbody{flex:1}.taskbody strong{display:block}.taskbody small{color:var(--muted)}input[type=checkbox]{accent-color:var(--accent);width:21px;height:21px}
nav{position:fixed;bottom:0;left:0;right:0;background:#1b222b;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:10px 4px calc(10px + env(safe-area-inset-bottom));z-index:5}
nav button{background:none;border:0;color:var(--muted);font-size:11px;display:grid;gap:3px;justify-items:center}nav button b{font-size:20px}nav button.active{color:var(--accent)}
button.primary{background:var(--accent);color:#111a15;border:0;border-radius:12px;padding:11px 14px;font-weight:800}
.pill{display:inline-block;padding:5px 9px;border-radius:20px;background:#293b34;color:#a8d3bb;font-size:11px}
.exercise{display:grid;grid-template-columns:104px 1fr;gap:13px;align-items:center}.art{background:#151b22;border-radius:14px;padding:6px;min-height:104px;display:grid;place-items:center}
.art svg{width:100%;height:100px}.exercise h3{margin:0 0 5px;font-size:16px}.exercise p{margin:0;color:var(--muted);font-size:12px;line-height:1.45}
.detail h2{margin:4px 0 8px}.detail h3{font-size:14px;margin:16px 0 6px;color:var(--accent)}.detail li{margin:6px 0;color:#d5dbe1;font-size:14px}
.pose{animation:pose 2.4s ease-in-out infinite alternate;transform-origin:center}@keyframes pose{from{opacity:.35}to{opacity:1}}
.tabs{display:flex;gap:8px;overflow:auto}.tabs button{white-space:nowrap;background:var(--panel2);color:var(--muted);border:0;border-radius:10px;padding:9px 12px}.tabs button.active{background:var(--accent);color:#111a15}
.empty{text-align:center;padding:28px;color:var(--muted)}
</style>
</head>
<body>
<header><div class="headrow"><div><div class="brand">МОЙ РИТМ</div><h1 id="pageTitle">Твой день</h1></div><div class="pill">0.2 • beta</div></div><div class="date" id="dateLabel"></div></header>
<main id="app"></main>
<nav>
<button data-tab="day" class="active"><b>◷</b>День</button>
<button data-tab="training"><b>✦</b>Тренировки</button>
<button data-tab="study"><b>▤</b>Учёба</button>
<button data-tab="stats"><b>▥</b>Прогресс</button>
</nav>
<script>
const days=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const fullDays=['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
const schedule=[
[['06:00','Подъём и утренние дела','Завтрак, умывание, сборы'],['06:30','Дорога в университет','Около 1 часа 30 минут'],['08:00','Занятия','Университет до 13:00'],['13:00','Дорога домой','Около 1 часа 30 минут'],['14:30','Обед и отдых','Восстановить силы'],['16:00','Самостоятельная учёба','Повторение и домашние задания'],['17:30','Активность','Силовая тренировка или прогулка'],['18:30','Душ и ужин','Спокойный вечер'],['19:15','Английский / чтение','20–30 минут'],['20:00','Свободное время','Видео, общение, творчество'],['21:30','Подготовка ко сну','Собрать вещи на завтра'],['22:00','Сон','Цель — 8–10 часов']],
[['06:00','Подъём и утренние дела','Завтрак, сборы'],['06:30','Дорога в университет','Около 1 часа 30 минут'],['08:00','Занятия','Университет до 13:00'],['13:00','Дорога домой','Около 1 часа 30 минут'],['14:30','Обед и отдых','Перерыв после занятий'],['16:00','Самостоятельная учёба','Повторение материала'],['17:30','Лёгкий бег / прогулка','Комфортный темп'],['18:30','Душ и ужин','Восстановление'],['19:15','Английский / чтение','Короткая практика'],['20:00','Свободное время','Отдых'],['21:30','Подготовка ко сну','Спокойный режим'],['22:00','Сон','']],
[['06:00','Подъём и утренние дела','Завтрак, сборы'],['06:30','Дорога в университет','Около 1 часа 30 минут'],['08:00','Занятия','Университет до 13:00'],['13:00','Дорога домой','Около 1 часа 30 минут'],['14:30','Обед и отдых','Перерыв'],['16:00','Самостоятельная учёба','Домашние задания'],['17:30','Силовая тренировка Б','Умеренная нагрузка'],['18:30','Душ и ужин','Восстановление'],['19:15','Английский / чтение','Практика'],['20:00','Свободное время','Отдых'],['21:30','Подготовка ко сну',''],['22:00','Сон','']],
[['06:30','Подъём','Без спешки, завтрак'],['07:30','Самостоятельная учёба','Сложные темы'],['09:00','Прогулка','Спокойная активность'],['10:00','Английский / чтение','20–30 минут'],['11:00','Свободное время','Личные дела'],['12:00','Обед и сборы',''],['12:30','Дорога в университет','Около 1 часа 30 минут'],['14:00','Занятия','Университет до 17:00'],['17:00','Дорога домой','Около 1 часа 30 минут'],['18:30','Ужин и отдых',''],['19:30','Свободное время','Без силовой тренировки'],['21:30','Подготовка ко сну',''],['22:00','Сон','']],
[['06:00','Подъём и утренние дела','Завтрак, сборы'],['06:30','Дорога в университет','Около 1 часа 30 минут'],['08:00','Занятия','Университет до 13:00'],['13:00','Дорога домой','Около 1 часа 30 минут'],['14:30','Обед и отдых',''],['16:00','Самостоятельная учёба',''],['17:30','Силовая тренировка А','Умеренная нагрузка'],['18:30','Душ и ужин',''],['19:15','Английский / чтение',''],['20:00','Свободное время',''],['21:30','Подготовка ко сну',''],['22:00','Сон','']],
[['08:00','Спокойный подъём','Можно выспаться'],['09:00','Завтрак',''],['10:00','Бег или прогулка','Комфортно, без гонки'],['11:00','Отдых',''],['12:00','Учёба по необходимости','Короткий блок'],['14:00','Обед и свободное время',''],['16:00','Чтение и творчество','Работа над книгой'],['Вечер','Свободное время',''],['22:00','Сон','']],
[['08:00','Спокойный подъём',''],['09:00','Завтрак',''],['10:00','Отдых и прогулка','По желанию'],['12:00','Подготовка к неделе','Сумка, материалы, план'],['14:00','Свободное время','Восстановление'],['20:30','Спокойный вечер','Подготовка ко сну'],['22:00','Сон','']]
];
const exercises=[
{id:'push',name:'Отжимания',muscles:'Грудь, трицепсы, плечи',level:'Базовое',desc:'Держи тело прямой линией, опускайся подконтрольно.',steps:['Поставь ладони чуть шире плеч, пальцы направлены вперёд.','Вытяни ноги и напряги корпус, не прогибай поясницу.','Сгибай локти и опускай грудь к полу в комфортной амплитуде.','Оттолкнись от пола, сохраняя корпус ровным.'],errors:['Не проваливай поясницу.','Не разводи локти строго в стороны.','Не задерживай дыхание.'],dose:'2–3 подхода по 6–12 повторений; оставляй запас сил.'},
{id:'squat',name:'Приседания',muscles:'Бёдра, ягодицы, корпус',level:'Базовое',desc:'Стопы устойчиво на полу, колени движутся по направлению носков.',steps:['Поставь ноги примерно на ширине плеч.','Отведи таз назад и согни колени.','Опускайся настолько, насколько можешь без потери устойчивости.','Поднимись, равномерно распределяя вес по стопе.'],errors:['Не отрывай пятки.','Не своди колени внутрь.','Не округляй спину намеренно.'],dose:'2–3 подхода по 8–12 повторений.'},
{id:'curl',name:'Сгибание рук с гантелями',muscles:'Бицепс и мышцы предплечья',level:'Среднее',desc:'Локти остаются возле корпуса, движение плавное.',steps:['Встань устойчиво, возьми лёгкие гантели ладонями вперёд.','Опусти плечи и прижми локти к бокам.','Согни руки, поднимая гантели без раскачивания корпуса.','Медленно опусти гантели в исходное положение.'],errors:['Не раскачивай туловище.','Не поднимай локти вслед за гантелями.','Не бросай вес вниз.'],dose:'2 подхода по 8–12 повторений с комфортным весом.'},
{id:'plank',name:'Планка',muscles:'Корпус, плечевой пояс',level:'Базовое',desc:'Сохраняй ровную линию от головы до пяток.',steps:['Поставь предплечья на пол, локти под плечами.','Вытяни ноги и обопрись на носки.','Напряги живот и ягодицы, сохраняя ровное положение.','Дыши спокойно и закончи подход до потери техники.'],errors:['Не поднимай таз слишком высоко.','Не провисай в пояснице.','Не задерживай дыхание.'],dose:'2 подхода по 15–30 секунд.'},
{id:'bridge',name:'Ягодичный мост',muscles:'Ягодицы, задняя поверхность бедра',level:'Базовое',desc:'Поднимай таз за счёт ягодиц, не переразгибая поясницу.',steps:['Ляг на спину, согни колени, стопы поставь на пол.','Руки положи вдоль тела.','Подними таз до комфортной прямой линии плечи–таз–колени.','На секунду напряги ягодицы и плавно опустись.'],errors:['Не прогибай поясницу в верхней точке.','Не отталкивайся шеей.'],dose:'2–3 подхода по 10–12 повторений.'}
];
let selectedDay=(new Date().getDay()+6)%7, tab='day';
let checks=JSON.parse(localStorage.getItem('myritm-checks')||'{}');
let activeExercise=null;
function save(){localStorage.setItem('myritm-checks',JSON.stringify(checks))}
function key(){let d=new Date();d.setDate(d.getDate()+(selectedDay-((d.getDay()+6)%7)));return d.toISOString().slice(0,10)}
function svg(id){let common=`<circle cx="50" cy="13" r="7" fill="#d7c4a4"/><g stroke="#8fb7a1" stroke-width="6" stroke-linecap="round" fill="none">`;
if(id==='push')return `<svg viewBox="0 0 130 100"><path d="M8 83H122" stroke="#45515e" stroke-width="3"/>${common}<path d="M50 23L68 43L91 49M68 43L42 65L22 80M91 49L108 77M68 43L76 68L65 81" /></g><g class="pose" stroke="#d2a66e" stroke-width="3" fill="none"><path d="M15 80L40 80M106 80L120 80"/></g></svg>`;
if(id==='squat')return `<svg viewBox="0 0 130 100"><path d="M8 85H122" stroke="#45515e" stroke-width="3"/>${common}<path d="M50 23L62 47L80 58L101 78M62 47L43 62L25 79M62 47L77 66L69 83M50 28L31 48M50 28L72 42"/></g></svg>`;
if(id==='curl')return `<svg viewBox="0 0 130 100">${common}<g stroke="#8fb7a1" stroke-width="6" stroke-linecap="round" fill="none"><path d="M50 23L55 56L54 82M55 35L31 48L40 30M55 35L78 48L91 29"/></g><g stroke="#d2a66e" stroke-width="3"><path d="M33 23V35M84 22V34"/></g></svg>`;
if(id==='plank')return `<svg viewBox="0 0 130 100"><path d="M8 84H122" stroke="#45515e" stroke-width="3"/>${common}<path d="M50 23L69 52L98 62L112 81M69 52L43 66L24 81M98 62L83 80"/></g></svg>`;
return `<svg viewBox="0 0 130 100"><path d="M8 85H122" stroke="#45515e" stroke-width="3"/>${common}<path d="M50 23L57 52L82 54L105 79M57 52L37 58L23 80M82 54L83 76L105 79"/></g></svg>`;
}
function renderDay(){let tasks=schedule[selectedDay],done=tasks.filter((t,i)=>checks[key()]?.[i]).length;return `<section class="card hero"><div class="date">${fullDays[selectedDay]} · ${new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}</div><h2 style="margin:8px 0">Маленькие шаги — большие перемены.</h2><div class="muted small">${done} из ${tasks.length} пунктов выполнено</div><div class="progress"><div class="bar" style="width:${done/tasks.length*100}%"></div></div></section><div class="days">${days.map((d,i)=>`<button class="day ${i===selectedDay?'active':''}" onclick="selectedDay=${i};render()">${d}</button>`).join('')}</div><h3 class="muted small">РАСПИСАНИЕ ДНЯ</h3>${tasks.map((t,i)=>`<section class="card task"><div class="time">${t[0]}</div><div class="taskbody"><strong>${t[1]}</strong><small>${t[2]}</small></div><input type="checkbox" ${checks[key()]?.[i]?'checked':''} onchange="toggle(${i},this.checked)"></section>`).join('')}<p class="muted small">Отметки сохраняются автоматически на этом устройстве.</p>`}
function renderTraining(){if(activeExercise){let e=exercises.find(x=>x.id===activeExercise);return `<button class="primary" onclick="activeExercise=null;render()">← Все упражнения</button><section class="card detail"><div class="art" style="height:170px">${svg(e.id)}</div><span class="pill">${e.level}</span><h2>${e.name}</h2><p class="muted">${e.muscles}</p><p>${e.desc}</p><h3>Как выполнять</h3><ol>${e.steps.map(s=>`<li>${s}</li>`).join('')}</ol><h3>Частые ошибки</h3><ul>${e.errors.map(s=>`<li>${s}</li>`).join('')}</ul><h3>Ориентир по нагрузке</h3><p>${e.dose}</p><p class="muted small">Остановись при боли, головокружении или необычном дискомфорте. Сначала техника, потом увеличение нагрузки.</p></section>`}
return `<section class="card hero"><span class="pill">План недели</span><h2>Тренируйся разумно</h2><p class="muted">Пн, Ср, Пт — силовые. Вт и Сб — лёгкий бег или прогулка. Чт и Вс — восстановление.</p></section><h3 class="muted small">БИБЛИОТЕКА УПРАЖНЕНИЙ</h3>${exercises.map(e=>`<section class="card exercise" onclick="activeExercise='${e.id}';render()"><div class="art">${svg(e.id)}</div><div><h3>${e.name}</h3><p>${e.muscles}</p><p style="margin-top:7px;color:#8fb7a1">Открыть инструкцию →</p></div></section>`).join('')}<p class="muted small">Иллюстрации схематичные: они показывают общую позу и не заменяют контроль техники.</p>`}
function renderStudy(){return `<section class="card"><h2>Учёба</h2><p class="muted">Короткие сосредоточенные блоки эффективнее бесконечного сидения за учебниками.</p><h3>Рекомендуемый ритм</h3><ul><li>45–60 минут на главные задания.</li><li>Перерыв 10–15 минут.</li><li>Английский — 20–30 минут, 4 раза в неделю.</li><li>Чтение и работа над книгой — 30 минут несколько раз в неделю.</li></ul></section><section class="card"><h3>Быстрая заметка</h3><textarea id="note" placeholder="Запиши тему, задание или идею для книги..." style="width:100%;min-height:110px;background:#151b22;color:#fff;border:1px solid #394451;border-radius:12px;padding:12px"></textarea><button class="primary" onclick="localStorage.setItem('myritm-note',document.getElementById('note').value);alert('Заметка сохранена')">Сохранить заметку</button></section>`}
function renderStats(){let total=Object.values(checks).reduce((s,d)=>s+Object.values(d).filter(Boolean).length,0);return `<section class="card hero"><h2>Твой прогресс</h2><div style="font-size:36px;color:var(--accent);font-weight:800">${total}</div><div class="muted">выполненных пунктов за всё время на этом устройстве</div></section><section class="card"><h3>Сохранение данных</h3><p class="muted">Сейчас данные хранятся локально в браузере этого телефона. Для синхронизации между устройствами понадобится подключить облачный аккаунт и разместить приложение на защищённом HTTPS-сайте.</p><button class="primary" onclick="exportData()">Экспортировать резервную копию</button> <label class="primary" style="display:inline-block;margin-top:8px">Импортировать<input type="file" accept="application/json" hidden onchange="importData(event)"></label></section><p class="muted small">Версия 0.2 beta · Мой ритм</p>`}
function toggle(i,v){checks[key()]??={};checks[key()][i]=v;save();render()}
function render(){document.getElementById('pageTitle').textContent=({day:'Твой день',training:'Тренировки',study:'Учёба',stats:'Прогресс'})[tab];document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.getElementById('app').innerHTML=tab==='day'?renderDay():tab==='training'?renderTraining():tab==='study'?renderStudy():renderStats();if(tab==='study')document.getElementById('note').value=localStorage.getItem('myritm-note')||''}
function exportData(){let blob=new Blob([JSON.stringify({checks,note:localStorage.getItem('myritm-note')||''},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='myritm-backup.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);checks=d.checks||{};save();localStorage.setItem('myritm-note',d.note||'');render();alert('Резервная копия загружена')}catch{alert('Не удалось прочитать файл')}};r.readAsText(f)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;activeExercise=null;render()});
document.getElementById('dateLabel').textContent=new Date().toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
render();
</script>
</body></html>
